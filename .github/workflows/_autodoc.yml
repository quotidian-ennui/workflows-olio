name: Update documentation

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, edited]

defaults:
  run:
    shell: bash

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PR_GITHUB_USER: qe-repo-updater[bot] <152897211+qe-repo-updater[bot]@users.noreply.github.com>

jobs:
  autodoc:
    name: autodoc
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Get Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.WORKFLOW_UPDATE_CLIENT_ID }}
          private-key: ${{ secrets.WORKFLOW_UPDATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: "${{ github.event.repository.name}}"
          permission-contents: write

      - name: Install auto-doc
        uses: jaxxstorm/action-install-gh-release@25e24d2d23ae098373794ef1d6faecb48ee52da8 # v3.0.0
        with:
          repo: tj-actions/auto-doc

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Run auto-doc
        run: |
          #!/usr/bin/env bash

          mapfile -t workflow_files < <(find ".github/workflows" -type f -name "*.yml")
          echo "::group::auto-doc generator"
          for workflow_file in "${workflow_files[@]}"; do
            workflow="$(basename "$workflow_file")"
            workflow_name="${workflow%%.yml}"
            workflow_doc="./docs/$workflow_name.md"
            if [[ -f "$workflow_doc" ]]; then
              echo "Generating docs for $workflow"
              auto-doc --colMaxWords 100 --reusable --filename "$workflow_file" --output "$workflow_doc"
            else
              echo "Skip $workflow because no documentation"
            fi
          done
          echo "::endgroup::"

      - name: Commit changes
        uses: iarekylew00t/verified-bot-commit@1ee4374942e5c5f814e9b3121d766cbe45cea360 # v2.3.6
        with:
          if-no-commit: info
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ steps.app-token.outputs.token }}
          message: "docs: update action documentation"
          update-local: false
          files: |
            **/*.md
